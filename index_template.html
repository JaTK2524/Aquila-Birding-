<!DOCTYPE html>
<html>
<head>
    <title>J.T.K Birding</title>
    <link rel="stylesheet" href="style.css">
    <link rel = "icon" href = "Props/J.T.K_Birding_Favicon.png">
</head>

<body>
<audio id = "birdAudio" src = "Props/MyMusic3.mp3" autoplay muted loop ></audio>
<button id = "muteButton" class = "audio_button">🔇</button>
<input type="text" id="search" placeholder=" Search Birds..." class="search_bar">
<div style = "text-align:center;">
<nav >
    <a href = "about-us.html" style = "text-decoration:underline;">About Us</a>
    &nbsp;&nbsp;
    <a href = "CasinoGame.html" style = "text-decoration:underline;">Casino</a>
    </nav>
    </div>
    <div class = "logo_box">
    <img src = "Props/J.T.K_Birding_Favicon.png"  
     class = "logo">
    <h1 class = "index_heading">Aquila Birding</h1>
    </div>
    <p>Birds documented: {{BIRD_COUNT}} and counting</p>
    <div class = "index_layout">
         <div class = "bird_list">
<h2 style = "font-weight:normal;">Browse Birds</h2>
    <ul>
        {{BIRD_LIST}}
    </ul>
</div>
<div>
<button id = "random-bird" class = "random_button">Random Bird</button>
</div>
<div class = "right_column">
<section class = "bird_of_the_day"">
    <figure>
    <h2 style = "text-decoration: underline; font-weight:normal;">Bird of the Day</h2>
    <h3 style = "font-weight:normal;"><a href = "birds/{{BOD_FILENAME}}" class = "bod_link">{{BIRD_OF_THE_DAY}}</a></h3>
    <a href = "birds/{{BOD_FILENAME}}">
    <img src = "Images/{{BOD_IMAGE}}"
         class = "bird_of_the_day_image">
         </a>
         </figure>
         </section>
         <section class  = "featured_bird">
         <h2 style = "text-decoration:underline; ">Featured Bird</h2>
         <a href = "birds/european-roller.html"><h3 style = "color:black;"  class = "featured_link">European Roller</h3></a>
         <figure>
         <a href = "birds/european-roller.html">
         <img src = "Images/EuropeanRoller1.jpg">
         </a>
         </figure>
         </section>
         </div>
</div>
<footer>
&copy; 2026 Aquila Birding
</footer>
<script>
const search = document.getElementById("search")
const birds = document.querySelectorAll(".bird")

search.addEventListener("input", function() {
const text = search.value.toLowerCase();
birds.forEach(function(bird) {
const name = bird.textContent.toLowerCase();
if (name.includes(text)) {
   bird.style.display = "";
  } else {
  bird.style.display = "none";
  }
});

 });
 

const birdLinks = document.querySelectorAll(".bird a");

document.getElementById("random-bird").addEventListener("click", function() {
    const randomBird = birdLinks[Math.floor(Math.random() * birdLinks.length)];
    window.location.href = randomBird.href;
});
const button = document.getElementById("muteButton")
const audio = document.getElementById("birdAudio")

button.addEventListener("click", function() {
 audio.muted = !audio.muted;
 
 if (audio.muted) {
    button.textContent = "🔇";
    } else {
             audio.play();
             button.textContent = "🔊";
             }
              });
</script>
</body>
</html>
